<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- PWA 配置 -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#667eea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="资源库" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    
    <!-- SEO 优化 -->
    <meta name="description" content="培鑫盈资源教程分享系统 - 专业的网络资源教程库，包含佛经、道藏、周易、风水、八字、古籍等分类资源" />
    <meta name="keywords" content="资源教程,佛经,道藏,周易,风水,八字,古籍,学习资料" />
    <meta name="author" content="Aspire Edge Studio" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="网络资源教程库" />
    <meta property="og:description" content="培鑫盈资源教程分享系统" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon.svg" />
    
    <title>网络资源教程库 - 培鑫盈资源教程分享</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    
    <!-- Service Worker 注册 -->
    <script type="module">
      if (import.meta.env.PROD && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration)
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError)
            })
        })
      }
    </script>
  </body>
</html>
