# 本地开发依赖：MongoDB + Redis
#
# 后端与前端建议在本机直接通过 npm 启动（见 README 快速开始），
# 这里只提供它们依赖的两个数据服务，方便一键拉起。
#
#   docker compose up -d     启动
#   docker compose down      停止
#
# 注意：此文件只启动数据服务，不包含应用本身。

services:
  mongodb:
    image: mongo:7.0
    container_name: netdisk-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: netdisk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  redis-data:
